name: Clear Cartridge Shells Build

on:
  push:
    paths:
      - '.github/workflows/clear-cart-shells.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    timeout-minutes: 60
    steps:
      - name: Get your build inputs
        uses: actions/checkout@v7
        with:
          path: build-inputs
          persist-credentials: false

      - name: Get the known-working shader source
        uses: actions/checkout@v7
        with:
          repository: oauramos/omega-zero
          ref: 2192ba96575452bf3403e9f566ec7af30760fbbb
          path: source
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends cmake file binutils
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin

      - name: Apply the reviewed achievement port
        run: |
          set -eu
          echo '1303400ac6d8f7ebb9b093e09b3db63a76826a153a664a21795b08a4861c32ea  build-inputs/retroachievements.patch' | sha256sum -c -
          git -C source apply --check ../build-inputs/retroachievements.patch
          git -C source apply ../build-inputs/retroachievements.patch

      - name: Apply Omega Zero Plus and Cart Studio support
        env:
          CART_PATCH_GZIP: ''
        run: |
          set -eu
          printf '%s' "$CART_PATCH_GZIP" | base64 --decode | gzip -dc > diagnostics.patch
          echo 'cc5d16ec024fb6656662d43f84072bfce9757b8968354b58ed3416728f5e1a75  diagnostics.patch' | sha256sum -c -
          git -C source apply --check ../diagnostics.patch
          git -C source apply ../diagnostics.patch

      - name: Format, device checks and offline tests
        working-directory: source
        run: |
          set -eu
          cargo fmt --all -- --check
          cargo clippy --locked -p omega-zero --no-default-features --features device -- -D warnings
          cargo test --locked -p omega-achievements -p omega-retro --lib
          cargo test --locked -p omega-input
          cargo test --locked -p omega-store --test suite
          cargo test --locked -p omega-ui --test suite
          cargo test --locked -p omega-power --test suite
          cargo test --locked -p omega-gfx -p omega-store --no-default-features --lib
          cargo test --locked -p omega-zero --no-default-features --features device --lib

      - name: Compile handheld executable and exact pinned cores
        working-directory: source
        run: task build:device core:device core:gpsp core:snes9x

      - name: Verify GB, GBC, GBA and SNES memory using the actual ARM cores
        working-directory: source
        run: cargo test --locked -p omega-retro --test achievement_memory -- --ignored --nocapture --test-threads=1

      - name: Prepare development download
        working-directory: source
        run: |
          set -eu
          file target-device/device/omega-zero | grep -q aarch64
          mkdir -p ../output/System/licenses ../output/Config
          cp target-device/device/omega-zero ../output/System/omega-zero
          cp crates/omega-achievements/retroachievements.toml.example ../output/Config/
          cp licenses/rcheevos-MIT.txt ../output/System/licenses/
          cp LICENSE ../output/System/licenses/omega-zero-GPL-3.0.txt
          cp RETROACHIEVEMENTS-PORT.md ../output/READ-FIRST.md
          cat >> ../output/READ-FIRST.md <<'EOF'

          ## Cart Studio import test
          Copy Cart Studio's export to Labels/cart_shell.txt. A valid entry
          takes precedence over both existing INI files. Files remain separate.
          Custom label PNGs are still in Labels/<system>/<ROM name>.png.
          Format compatibility follows the Omega-Zero forks by MatanItzhaki12
          and FrankieT19. Keep your working Omega Zero Plus executable for rollback.

          ## Clear cartridge shells
          Clear and glitter shells show more of the board and components through
          the existing 3D cartridge model. Label rendering is untouched.
          Shell rendering adapted from MatanItzhaki12/omega-zero-matan,
          through 7c102e3 plus the component placement from 9832aae.
          EOF
          cp ../build-inputs/retroachievements.patch ../output/
          cp ../diagnostics.patch ../output/clear-cart-shells.patch
          sha256sum ../output/System/omega-zero > ../output/omega-zero.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: omega-zero-plus-clear-cart-shells
          path: output/
          if-no-files-found: error
