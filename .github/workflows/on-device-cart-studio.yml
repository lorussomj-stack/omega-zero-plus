name: On-Device Cart Studio Build

on:
  push:
    paths:
      - '.github/workflows/on-device-cart-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    timeout-minutes: 60
    steps:
      - name: Get your build inputs
        uses: actions/checkout@v7
        with:
          path: build-inputs
          persist-credentials: false

      - name: Get the known-working shader source
        uses: actions/checkout@v7
        with:
          repository: oauramos/omega-zero
          ref: 2192ba96575452bf3403e9f566ec7af30760fbbb
          path: source
          persist-credentials: false

      - name: Get the original Slot shell artwork
        uses: actions/checkout@v7
        with:
          repository: pvaibhav/slot
          ref: b3473670b03a3fd29eefb5fdcded53669122c748
          path: slot-art
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends cmake file binutils
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin

      - name: Apply the reviewed achievement port
        run: |
          set -eu
          echo '1303400ac6d8f7ebb9b093e09b3db63a76826a153a664a21795b08a4861c32ea  build-inputs/retroachievements.patch' | sha256sum -c -
          git -C source apply --check ../build-inputs/retroachievements.patch
          git -C source apply ../build-inputs/retroachievements.patch

      - name: Apply Omega Zero Plus and Cart Studio support
        env:
          CART_PATCH_GZIP: ''
        run: |
          set -eu
          printf '%s' "$CART_PATCH_GZIP" | base64 --decode | gzip -dc > diagnostics.patch
          echo '8b44a7c30850f5a194a60f5d86722e9bd3cf788b69ccbca4e043f09807226ed5  diagnostics.patch' | sha256sum -c -
          git -C source apply --check ../diagnostics.patch
          git -C source apply ../diagnostics.patch

      - name: Apply startup and Slot-style controls
        env:
          STARTUP_PATCH_GZIP: ''
        run: |
          set -eu
          printf '%s' "$STARTUP_PATCH_GZIP" | base64 --decode | gzip -dc > startup-controls.patch
          echo 'f07bb8ce45fc720bbefab7cb5bddebc6b8331597733df19c22e4a1ad86026b5e  startup-controls.patch' | sha256sum -c -
          git -C source apply --check ../startup-controls.patch
          git -C source apply ../startup-controls.patch

      - name: Apply Cart Studio GBC shells
        env:
          STUDIO_SHELL_PATCH: ''
        run: |
          set -eu
          printf '%s' "$STUDIO_SHELL_PATCH" | base64 --decode | gzip -dc > gbc-studio-shells.patch
          echo '1d76aefef4629a74fa03811efdb66bc766e4742b475f5022a54956d21f7b1e60  gbc-studio-shells.patch' | sha256sum -c -
          git -C source apply --check ../gbc-studio-shells.patch
          git -C source apply ../gbc-studio-shells.patch
          echo '5244d369f029132db74f28fd51f65bbfdebbf62cd869b36e9449177cdf4ad9cf  slot-art/assets/gbc_neutral.png' | sha256sum -c -
          echo '20e1e014966e60c48b8345ca0194df2e196d381a9bf1f1747d4dd7699b904c40  slot-art/assets/gbc_interior.png' | sha256sum -c -
          echo 'cc1f1dc25977e69541481dceb8b3098ca8b0e1ca6410de28eeee2c565afc142d  slot-art/assets/gb_board.png' | sha256sum -c -
          cp slot-art/assets/gbc_neutral.png slot-art/assets/gbc_interior.png slot-art/assets/gb_board.png source/crates/omega-ui/assets/slot/

      - name: Extend Studio shells to notched Game Boy and GBA
        env:
          STUDIO_FAMILY_PATCH: ''
        run: |
          set -eu
          printf '%s' "$STUDIO_FAMILY_PATCH" | base64 --decode | gzip -dc > game-boy-studio-shells.patch
          echo 'e8aa943e8a2515bd186f5f1238747b1bcfa071e34ba9c1f0b0ab818a0c7cc310  game-boy-studio-shells.patch' | sha256sum -c -
          git -C source apply --check ../game-boy-studio-shells.patch
          git -C source apply ../game-boy-studio-shells.patch
          echo '0771e3ac10a0d89c74609ce0081d1af0fb76d4b314ccff17d8306661e32487a2  slot-art/assets/gb_neutral.png' | sha256sum -c -
          echo 'c9b7d96f21592fa2487d3c9c52f967662d09dc36ae9d5dc59966d3ca02efc6e9  slot-art/assets/gb_interior.png' | sha256sum -c -
          echo '9cb83dc6f5c9529cb7582e869f9afcdb546d5ea4b5bf667cbd271fc05beae8a3  slot-art/assets/gba_neutral.png' | sha256sum -c -
          echo '1e037c9a2de8d5d46cdcee2441287cf0bae5bb6cd32498e7486bbed17693155f  slot-art/assets/gba_interior.png' | sha256sum -c -
          echo 'b565d5937915c7b79466d8975f54977f859edb9df8468d5cf8b7c409874f657b  slot-art/assets/board.png' | sha256sum -c -
          cp slot-art/assets/gb_neutral.png slot-art/assets/gb_interior.png slot-art/assets/gba_neutral.png slot-art/assets/gba_interior.png slot-art/assets/board.png source/crates/omega-ui/assets/slot/

      - name: Apply textured SNES and Super Famicom shells
        env:
          STUDIO_SNES_PATCH: ''
        run: |
          set -eu
          printf '%s' "$STUDIO_SNES_PATCH" | base64 --decode | gzip -dc > snes-studio-shells.patch
          echo '8731fe8bcd9f3d742b78c6dabe7f28718797bd32e4902eef701ee86629cbfd94  snes-studio-shells.patch' | sha256sum -c -
          git -C source apply --check ../snes-studio-shells.patch
          git -C source apply ../snes-studio-shells.patch

      - name: Apply on-device Cart Studio
        env:
          HANDHELD_STUDIO_PATCH: ''
        run: |
          set -eu
          printf '%s' "$HANDHELD_STUDIO_PATCH" | base64 --decode | gzip -dc > on-device-cart-studio.patch
          echo 'c5a2471a6e1cce7fb102c18d8422f6ec2780f8996d36bda6400079350b35cd25  on-device-cart-studio.patch' | sha256sum -c -
          git -C source apply --check ../on-device-cart-studio.patch
          git -C source apply ../on-device-cart-studio.patch

      - name: Add solid and clear glitter finishes
        env:
          GLITTER_FINISH_PATCH: ''
        run: |
          set -eu
          printf '%s' "$GLITTER_FINISH_PATCH" | base64 --decode | gzip -dc > glitter-finishes.patch
          echo 'a1360c557f48e034e0d9996bb2d4f7d4a2d9a394ee257b9faf750133fe37b916  glitter-finishes.patch' | sha256sum -c -
          git -C source apply --check ../glitter-finishes.patch
          git -C source apply ../glitter-finishes.patch

      - name: Add Gamebit, label fetching and the refined Cart Studio
        env:
          GAMEBIT_STUDIO_PATCH: ''
        run: |
          set -eu
          printf '%s' "$GAMEBIT_STUDIO_PATCH" | base64 --decode | gzip -dc > gamebit-cart-studio.patch
          echo 'b78b078dae6c5c249f8595f749683e485f5e69b6ed6526ad591ab0e6dff61396  gamebit-cart-studio.patch' | sha256sum -c -
          git -C source apply --check ../gamebit-cart-studio.patch
          git -C source apply ../gamebit-cart-studio.patch

      - name: Add Modern interface theme
        env:
          MODERN_THEME_PATCH: ''
        run: |
          set -eu
          printf '%s' "$MODERN_THEME_PATCH" | base64 --decode | gzip -dc > modern-theme.patch
          echo '9d9bbcc7c29a30a4253da294f64edee5912726750c923ba23e9d1b91f8cd11e4  modern-theme.patch' | sha256sum -c -
          git -C source apply --check ../modern-theme.patch
          git -C source apply ../modern-theme.patch
          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/5bb28733cec313b63fbd415b574b5ae35c8aa8b8/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf' -o source/crates/omega-ui/assets/Inter.ttf
          curl -fsSL https://raw.githubusercontent.com/google/fonts/5bb28733cec313b63fbd415b574b5ae35c8aa8b8/ofl/inter/OFL.txt -o source/crates/omega-ui/assets/Inter-OFL.txt
          echo '29160a80ff49ddcab2c97711247e08b1fab27a484a329ce8b813d820dc559031  source/crates/omega-ui/assets/Inter.ttf' | sha256sum -c -
          echo '5b9321a4298cfeb6b34354164a1c3afc3db114569984c502b9b35d988fd58c57  source/crates/omega-ui/assets/Inter-OFL.txt' | sha256sum -c -

      - name: Format, device checks and offline tests
        working-directory: source
        run: |
          set -eu
          cargo fmt --all -- --check
          cargo clippy --locked -p omega-zero --no-default-features --features device -- -D warnings
          cargo test --locked -p omega-achievements -p omega-retro --lib
          cargo test --locked -p omega-input
          cargo test --locked -p omega-store --test suite
          cargo test --locked -p omega-ui --lib --test suite
          cargo test --locked -p omega-power --test suite
          cargo test --locked -p omega-gfx -p omega-store --no-default-features --lib
          cargo test --locked -p omega-zero --no-default-features --features device --lib

      - name: Compile handheld executable and exact pinned cores
        working-directory: source
        run: task build:device core:device core:gpsp core:snes9x

      - name: Verify GB, GBC, GBA and SNES memory using the actual ARM cores
        working-directory: source
        run: cargo test --locked -p omega-retro --test achievement_memory -- --ignored --nocapture --test-threads=1

      - name: Prepare development download
        working-directory: source
        run: |
          set -eu
          file target-device/device/omega-zero | grep -q aarch64
          mkdir -p ../output/System/licenses ../output/Config
          cp target-device/device/omega-zero ../output/System/omega-zero
          cp crates/omega-achievements/retroachievements.toml.example ../output/Config/
          cp licenses/rcheevos-MIT.txt ../output/System/licenses/
          cp LICENSE ../output/System/licenses/omega-zero-GPL-3.0.txt
          cp crates/omega-ui/assets/Inter-OFL.txt ../output/System/licenses/Inter-OFL.txt
          cp RETROACHIEVEMENTS-PORT.md ../output/READ-FIRST.md
          cat >> ../output/READ-FIRST.md <<'EOF'

          ## Cart Studio import test
          Copy Cart Studio's export to Labels/cart_shell.txt. A valid entry
          takes precedence over both existing INI files. Files remain separate.
          Custom label PNGs are still in Labels/<system>/<ROM name>.png.
          Format compatibility follows the Omega-Zero forks by MatanItzhaki12
          and FrankieT19. Keep your working Omega Zero Plus executable for rollback.

          ## Clear cartridge shells
          Clear and glitter shells show more of the board and components through
          the existing 3D cartridge model. Label rendering is untouched.
          Shell rendering adapted from MatanItzhaki12/omega-zero-matan,
          through 7c102e3 plus the component placement from 9832aae.

          ## Favorites shelf
          Press Y on a game while browsing to add or remove its star.
          L1/R1 includes Favorites once it has a game. The list is stored
          in Slot-compatible Config/favorites.txt. Based on the Favorites
          implementation in MatanItzhaki12/omega-zero-matan (134dbda,
          e96a688, 2b5667b), adapted for the Omega Zero Plus controls.

          ## Startup and Slot-style controls
          Startup skips the frontend intro and highlights the last selected
          cartridge on its shelf, even after shutting down during a game.
          To set a custom RG35XXSP splash, put a 640x480 PNG at
          System/bootlogo.png. It is installed for subsequent boots after the
          updated executable runs. Remove the PNG to use the supplied BMP again.
          Tap MENU on the shelf for Settings. Use Clock Format to choose 12H
          or 24H. START opens the core picker where a choice is available.
          Hold POWER to shut down. Tap MENU during gameplay for Resume,
          Undo Save / Load, States, Settings, Restart or Exit Game.
          The in-game Settings page reuses the existing gameplay settings.
          Startup behavior follows the idea in FrankieT19/omega-zero.
          The controls and pause menu follow Slot.

          ## Cart Studio Game Boy family shells
          Game Boy, Game Boy Color, and GBA use Slot's textured shell, interior
          and board artwork on their own 3D meshes with recessed labels.
          The existing Cart Studio export supplies the shell shape, tint and
          finish. The existing label files still supply the sticker art.
          Artwork from pvaibhav/slot at b347367, under the upstream GPL-3.0.

          ## Textured SNES shells
          The North American SNES and Japanese/European shells use their
          existing regional shapes with textured plastic, molded edges, and
          recessed labels. Existing shape, color, finish, and label settings
          continue to work.

          ## On-device Cart Studio
          Highlight a GB, GBC, GBA, or SNES game and press SELECT to open
          the shell editor. Up and Down pick a row. Left and Right change
          it, with L1 and R1 for larger RGB steps. Press A to save, B to
          discard, or X then A to return to the automatic shell.
          Controls is now in Settings. Existing artwork and browser shell
          exports are read as before. Handheld overrides are stored per
          system in Labels/cart_shell.txt.
          Finish offers Solid, Clear, Clear Glitter, and Solid Glitter.
          Existing glitter entries still use Clear Glitter. Solid Glitter
          is saved as solid-glitter and renders opaque plastic with flecks.

          ## Gamebit and label fetching
          Join Wi-Fi, then open Settings > Network > Gamebit. On the same
          trusted Wi-Fi network, open the address shown on the handheld and
          enter its session PIN. Upload or download GB, GBC, GBA or SNES
          games, .sav files, label PNGs, and screen-sized overlay PNGs.
          Back out of Gamebit to stop the server and refresh the shelf.
          The file manager is limited to those four folders and platforms.
          Save-state files are separate from .sav files.

          In Cart Studio, press Y to fetch a label matching the GB, GBC or
          GBA ROM checksum from Slot's catalog. A saves the preview, B
          discards it. Upload SNES label PNGs through Gamebit.

          Gamebit's HTTP server was adapted from Slot v1.15.2
          (https://github.com/slot-cfw/slot/tree/v1.15.2),
          GPL-3.0-or-later. Online label artwork is provided by Slot's art
          service and belongs to its respective rights holders.

          ## Modern interface theme
          Open Settings > Theme > Interface and select Modern. The theme
          applies immediately and the selection is saved on the card.
          Accent changes the selected control colour. Switch back to
          Classic Omega to use the classic backdrop and font options.
          Modern uses Inter, distributed under the SIL Open Font License.
          EOF
          cp ../modern-theme.patch ../output/
          cp ../gamebit-cart-studio.patch ../output/
          cp ../glitter-finishes.patch ../output/
          cp ../on-device-cart-studio.patch ../output/
          cp ../snes-studio-shells.patch ../output/
          cp ../game-boy-studio-shells.patch ../output/
          cp ../gbc-studio-shells.patch ../output/
          cp -R crates/omega-ui/assets/slot ../output/slot-source-art
          cp ../startup-controls.patch ../output/
          cp ../build-inputs/retroachievements.patch ../output/
          cp ../diagnostics.patch ../output/favorites-shelf.patch
          sha256sum ../output/System/omega-zero > ../output/omega-zero.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: omega-zero-plus-modern-theme
          path: output/
          if-no-files-found: error
